[project]
name = "dmind"
version = "0.1.0"
description = "A small, deterministic runtime for digital-mind experiments."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
hf = ["transformers>=4.44", "torch>=2.2", "huggingface_hub>=0.24", "datasets>=2.19"]
all = ["openai>=1.0", "anthropic>=0.40", "google-genai>=1.0", "transformers>=4.44", "torch>=2.2", "huggingface_hub>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The import root is `src`, holding `src.api` and `src.dminds`. Install this
# editable, so `src` resolves to the repo rather than to site-packages.
packages = ["src"]

[tool.pytest.ini_options]
# Tests drive the event loop with asyncio.run themselves, so no plugin is needed.
testpaths = ["tests"]
