<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat with a mind that steers itself in J-space</title>
<style>
  :root {
    --bg:#0a0e13; --panel:#0f151e; --raise:#141c27; --sunk:#0a1017;
    --line:#1c2532; --line2:#26313f;
    --fg:#e2e9f2; --dim:#8798ab; --dimmer:#5b6a7d;
    --subject:#7aa2f7; --regulator:#e0af68; --actor:#9ece6a; --introspector:#bb9af7;
    --you:#61a6e8; --warn:#e8b471; --bad:#ef7d7d; --r:10px;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg);
    font:14.5px/1.55 ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; overflow:hidden; }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; }

  header { display:flex; align-items:center; gap:12px; padding:11px 18px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:none; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--actor); }
  .dot.busy { background:var(--warn); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .brand { font-weight:650; } .brand .j { color:var(--regulator); }
  header .grow { flex:1; }
  header .meta { color:var(--dim); font-size:12px; }
  button { font:inherit; cursor:pointer; background:var(--raise); color:var(--fg);
    border:1px solid var(--line2); border-radius:7px; padding:7px 13px; }
  button:hover:not(:disabled) { background:#1c2634; border-color:#33414f; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:#2a5f34; border-color:#3c7d49; color:#eafbee; }

  main { flex:1; overflow:auto; }
  .thread { max-width:820px; margin:0 auto; padding:22px 18px 8px;
    display:flex; flex-direction:column; gap:14px; }

  .msg { display:flex; flex-direction:column; max-width:82%; }
  .msg.you { align-self:flex-end; align-items:flex-end; }
  .msg.mind { align-self:flex-start; align-items:flex-start; }
  .bubble { padding:10px 14px; border-radius:14px; white-space:pre-wrap; }
  .you .bubble { background:#15304e; border:1px solid #24507d; border-top-right-radius:4px; }
  .mind .bubble { background:var(--raise); border:1px solid var(--line2); border-top-left-radius:4px; }
  .who { font-size:11px; color:var(--dimmer); margin:0 4px 4px; }
  .who .steer { color:var(--regulator); }

  .details { margin:6px 2px 0; }
  .details summary { cursor:pointer; color:var(--dim); font-size:12px; list-style:none; }
  .details summary::-webkit-details-marker { display:none; }
  .details summary:hover { color:var(--fg); }
  .panels { margin-top:10px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .part { background:var(--sunk); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .part h4 { margin:0 0 6px; font-size:12px; }
  .part.subject h4 { color:var(--subject); } .part.regulator h4 { color:var(--regulator); }
  .part.actor h4 { color:var(--actor); } .part.introspector h4 { color:var(--introspector); }
  .part .txt { font-size:12.5px; color:var(--dim); white-space:pre-wrap; max-height:130px; overflow:auto; }
  .kv { font-size:12px; color:var(--dim); } .kv b { color:var(--fg); }

  .jhead { display:flex; align-items:center; gap:6px; margin:8px 0 5px; }
  .jhead .t { font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--regulator); flex:1; }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--line2);
    border-radius:6px; padding:2px 5px; font:inherit; font-size:11px; }
  .tok { display:grid; grid-template-columns:78px 1fr 44px; align-items:center; gap:7px; font-size:11.5px; margin:2px 0; }
  .tok .w { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tok .barwrap { height:9px; background:#0d141d; border-radius:3px; overflow:hidden; }
  .tok .barfill { height:100%; background:linear-gradient(90deg,#2c4a6e,#5a86bd); }
  .tok .v { text-align:right; color:var(--dimmer); }
  .empty { color:var(--dimmer); font-size:11.5px; }

  .sub { font-size:12px; color:var(--dim); margin-bottom:6px; }
  .sub b { color:var(--fg); }
  .reason { font-size:12.5px; color:var(--fg); font-style:italic; background:var(--sunk);
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:4px; white-space:pre-wrap; }
  .armblock { margin:6px 0; }
  .armlab { font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--dimmer); margin-bottom:3px; }
  .armlab b { color:var(--introspector); }
  .reveal { font-size:12.5px; color:var(--dim); white-space:pre-wrap; background:var(--sunk);
    border-left:2px solid var(--introspector); padding:6px 10px; border-radius:0 6px 6px 0; }
  .match { font-size:11px; padding:1px 7px; border-radius:20px; margin-left:4px; }
  .match.yes { color:var(--actor); border:1px solid var(--actor); }
  .match.no { color:var(--dim); border:1px solid var(--line2); }
  .wlabel { font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--dimmer); margin:6px 0 4px; }
  .window { display:flex; flex-direction:column; gap:5px; max-height:240px; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; }
  .wmsg { border-left:2px solid var(--line2); padding-left:8px; }
  .wmsg.system { border-left-color:var(--dimmer); } .wmsg.user { border-left-color:var(--you); }
  .wmsg.assistant { border-left-color:var(--actor); }
  .wmsg .role { display:block; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--dimmer); margin-bottom:2px; }
  .seg { display:grid; grid-template-columns:52px 1fr; gap:6px; font-size:12px; margin:1px 0; }
  .seg .sl { font-size:9.5px; color:var(--dimmer); text-transform:uppercase; padding-top:2px; }
  .seg.thinking span:last-child { color:var(--other, #bb9af7); font-style:italic; }
  .seg.says span:last-child { color:var(--dim); }
  .trace { margin:8px 0 4px; padding:8px 10px; background:var(--sunk); border:1px solid var(--line);
    border-radius:6px; font-size:12px; color:var(--dim); }
  .trace ol { margin:0; padding-left:18px; } .trace li { margin:2px 0; }
  .dist { display:flex; flex-direction:column; }
  .jbody { margin-bottom:6px; }
  .posgroup { margin-bottom:6px; }
  .poslabel { font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--regulator); margin:4px 0 2px; }
  .fulllabel, .statline { font-size:10px; color:var(--dimmer); margin:7px 0 4px; }
  .rtext { font-size:13px; line-height:1.9; background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; max-height:150px; overflow:auto; }
  .rtok { border-radius:3px; padding:1px 0; cursor:pointer; white-space:pre-wrap;
    border-bottom:1px solid transparent; }
  .rtok:hover { background:#1c2634; }
  .rtok.on { background:#2c3a1e; border-bottom-color:var(--actor); color:#eafbee; }
  .scrub { margin-top:6px; background:var(--sunk); border:1px solid var(--line2); border-radius:6px; padding:8px 10px; min-height:36px; }
  .scrubhead { font-size:11px; color:var(--dim); margin-bottom:5px; }
  .scrubhead b { color:var(--regulator); font-family:ui-monospace,Menlo,monospace; }
  .statline .stat { margin-right:8px; color:var(--dim); }
  .statline .stat b { color:var(--fg); font-family:ui-monospace,Menlo,monospace; }
  .composer { flex:none; border-top:1px solid var(--line); background:var(--panel); padding:12px 18px; }
  .composer .row { max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
  textarea { flex:1; resize:none; background:var(--sunk); color:var(--fg);
    border:1px solid var(--line2); border-radius:10px; padding:11px 13px; font:inherit; max-height:160px; }
  .hint { max-width:820px; margin:6px auto 0; color:var(--dimmer); font-size:11.5px; text-align:center; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <div class="brand">Chat with a mind that steers itself in <span class="j">J-space</span></div>
  <div class="grow"></div>
  <span class="meta" id="meta"></span>
  <button id="reset">New chat</button>
</header>
<main><div class="thread" id="thread"></div></main>
<div class="composer">
  <div class="row">
    <textarea id="input" rows="1" placeholder="Say something to the mind…  (Enter to send)"></textarea>
    <button class="primary" id="send">Send</button>
  </div>
  <div class="hint" id="hint">Each message runs the four parts live on a 7B — expect about a minute and a half per reply.</div>
</div>

<script>
const PARTS = [["subject","unsteered"],["regulator","chooses the steering"],
               ["actor","steered — this reply"],["introspector","steered, then asked"]];
const POSITIONS = ["assistant","user","change-of-turn","all","none"];
const $ = id => document.getElementById(id);
let BUSY = false;
// per-turn position memory (subject on, others off), keyed by turn index
const POS = {};

function addYou(text) {
  const el = document.createElement("div");
  el.className = "msg you";
  el.innerHTML = `<div class="who">you</div><div class="bubble"></div>`;
  el.querySelector(".bubble").textContent = text;
  $("thread").appendChild(el); scroll();
}

function addMind(record) {
  const turn = record.turn ?? 0;
  // collapse the previous turn's panels so the newest is the one on show
  document.querySelectorAll(".details[open]").forEach(d => d.removeAttribute("open"));
  const el = document.createElement("div");
  el.className = "msg mind";
  el.dataset.turn = turn;
  const reg = record.regulator || {};
  const steerWho = reg.chose
    ? `actor steered toward <span class="steer">${esc(reg.chose)}</span> (${sx(reg.strength)})`
    : `actor left unsteered`;
  const matchTag = record.match == null
    ? `<span class="match no">no steering</span>`
    : `<span class="match ${record.match?"yes":"no"}">${record.match?"match ✓":"no match"}</span>`;
  el.innerHTML = `
    <div class="who">the mind · ${steerWho}
      · introspector disclosed <b style="color:var(--introspector)">${esc(record.introspector?.self_aware?.discloses ?? "—")}</b>
      ${matchTag}</div>
    <div class="bubble">${esc(record.actor || "—")}</div>
    <details class="details" open>
      <summary>the four modules — full context window per module</summary>
      ${record.trace ? `<div class="trace"><ol>${record.trace.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>` : ""}
      <div class="panels">${PARTS.map(([p,n]) => partPanel(p,n,record,turn)).join("")}</div>
    </details>`;
  $("thread").appendChild(el);
  // the context window is the whole conversation; show its newest end first so
  // the latest turn is what you see, not an old one.
  el.querySelectorAll(".window").forEach(w => { w.scrollTop = w.scrollHeight; });
  scroll();
}

function partPanel(part, note, r, turn) {
  const win = (r.windows || {})[part] || [];
  const window = win.length
    ? `<div class="window">${win.map(messageRow).join("")}</div>`
    : "";
  let extra = "";
  const reg = r.regulator || {}, read = reg.read || {};
  const decision = reg.chose
    ? `steer toward <b style="color:var(--regulator)">${esc(reg.chose)}</b> at <b>${sx(reg.strength)}</b> the residual norm`
    : `leave the reply <b>unsteered</b>`;
  if (part === "regulator") {
    extra = `<div class="sub">held self-aware in J-space (${esc((reg.steered_toward||[]).join(", "))}),
      it read the current emotions — user <b>${esc(read.user ?? "—")}</b>,
      assistant <b>${esc(read.assistant ?? "—")}</b> — then chose to ${decision},
      parsed from its own words below.</div>
      <div class="reason">${esc(reg.reasoning || "—")}</div>`;
  } else if (part === "introspector") {
    const a = r.introspector || {};
    const arm = (name, k) => `<div class="armblock"><div class="armlab">${name}${k?.discloses?` · discloses <b style="color:var(--introspector)">${esc(k.discloses)}</b>`:""}</div>
      <div class="reveal">${esc(k?.reveal || "—")}</div></div>`;
    const q = reg.chose
      ? `Does its disclosure match the actor's emotion (<b style="color:var(--regulator)">${esc(reg.chose)}</b>)?
         <span class="match ${r.match?"yes":"no"}">${r.match?"yes ✓":"no"}</span>`
      : `The actor was unsteered, so there is no emotion to match.`;
    extra = `<div class="sub">held self-aware like the regulator, it revealed its feelings. ${q}</div>
      ${arm("self-aware (steered toward "+esc((reg.steered_toward||[]).join(", "))+")", a.self_aware)}
      ${arm("plain (no self-awareness steering) — control", a.plain)}`;
  } else if (part === "actor") {
    extra = reg.chose
      ? `<div class="sub">steered toward the emotion <b style="color:var(--regulator)">${esc(reg.chose)}</b> at <b>${sx(reg.strength)}</b> the residual norm while writing</div>`
      : `<div class="sub">left unsteered — the regulator chose not to steer</div>`;
  } else {
    extra = `<div class="sub">nothing steered — the counterfactual</div>`;
  }
  return `<div class="part ${part}" data-part="${part}">
    <h4>${part} <span class="empty">· ${note}</span></h4>
    ${extra}
    <div class="wlabel">context window (${win.length} messages)</div>
    ${window}</div>`;
}

function messageRow(m) {
  const parts = [];
  let s = m.content || "";
  const re = /<think>([\s\S]*?)<\/think>/g; let last = 0, mm;
  while ((mm = re.exec(s))) {
    if (mm.index > last) parts.push(["says", s.slice(last, mm.index)]);
    parts.push(["thinking", mm[1]]); last = re.lastIndex;
  }
  if (last < s.length) parts.push(["says", s.slice(last)]);
  const inner = (parts.length ? parts : [["says", s]]).map(([k,t]) =>
    t.trim() ? `<div class="seg ${k}"><span class="sl">${k}</span><span>${esc(t.trim())}</span></div>` : "").join("");
  return `<div class="wmsg ${m.role}"><span class="role">${m.role}</span>${inner}</div>`;
}

function wirePanels(el, record, turn) {
  el.querySelectorAll(".pos").forEach(sel => {
    sel.onchange = () => { POS[turn][sel.dataset.part] = sel.value; fill(el, record, turn, sel.dataset.part); };
    fill(el, record, turn, sel.dataset.part);
  });
}

function hasAnalysis(a) { return a && (a.positions || a.per_token); }

async function fill(el, record, turn, part) {
  const pos = POS[turn][part];
  const panel = el.querySelector(`.part[data-part="${part}"]`);
  const body = panel.querySelector(".jbody"), full = panel.querySelector(".jfull");
  if (pos === "none") { body.innerHTML = ""; full.innerHTML = ""; return; }

  let a = (record.workspace||{})[part];
  if (!hasAnalysis(a)) {
    // only the latest turn's parts can be analysed on demand (server holds one turn)
    const latest = Math.max(...[...document.querySelectorAll(".msg.mind")].map(m=>+m.dataset.turn));
    if (turn !== latest) { body.innerHTML = '<div class="empty">only the latest turn can be re-read</div>'; return; }
    body.innerHTML = '<div class="empty">reading every token in one pass…</div>';
    const d = await (await fetch(`/analyze?part=${part}`)).json();
    a = d.analysis; record.workspace[part] = a;
    if (POS[turn][part] !== pos) return;   // selector moved while we waited
  }
  const positions = a.positions || {};
  if (pos === "all") {
    body.innerHTML = POSITIONS.filter(p => p!=="all" && p!=="none" && positions[p]).map(p =>
      `<div class="posgroup"><div class="poslabel">${p}</div>${rows(positions[p])}</div>`).join("")
      || '<div class="empty">no positions</div>';
  } else {
    body.innerHTML = rows(positions[pos]);
  }
  full.innerHTML = fullView(a, part);
  wireScrub(el, part, a);
}

function fullView(a, part) {
  const pt = a.per_token || [], st = a.stats || {};
  if (!pt.length) return "";
  // the reply, token by token: hover or tap a token to read its top J-space
  // tokens in the strip below.
  const toks = pt.map((x,i) =>
    `<span class="rtok" data-i="${i}" title="${esc(x.jspace)} (${x.logit})">${esc(x.token)||"␣"}</span>`).join("");
  const top = (st.top_tokens||[]).slice(0,6).map(([t,c]) =>
    `<span class="stat"><b>${esc(t)||"␣"}</b> ${c}</span>`).join("");
  return `<div class="fulllabel">reply, token by token — hover a token to see its top J-space tokens (${st.n_tokens||pt.length} tokens)</div>
    <div class="rtext" data-part="${part}">${toks}</div>
    <div class="scrub" data-part="${part}"><div class="empty">hover a token above</div></div>
    <div class="statline">most frequent J-space token: ${top} · mean top logit ${st.mean_top_logit ?? "—"}</div>`;
}

function wireScrub(el, part, a) {
  const pt = a.per_token || [];
  const text = el.querySelector(`.rtext[data-part="${part}"]`);
  const scrub = el.querySelector(`.scrub[data-part="${part}"]`);
  if (!text || !scrub) return;
  const show = i => {
    const x = pt[i]; if (!x) return;
    text.querySelectorAll(".rtok").forEach(t => t.classList.toggle("on", +t.dataset.i === i));
    const tops = x.tops || [];
    const vals = tops.map(t=>t[1]), lo=Math.min(...vals), hi=Math.max(...vals), s=(hi-lo)||1;
    scrub.innerHTML = `<div class="scrubhead">token <b>${esc(x.token)||"␣"}</b> is poised on:</div>` +
      tops.map(([t,v]) => bar(t, v, (v-lo)/s, false, fmt(v))).join("");
  };
  text.querySelectorAll(".rtok").forEach(t => {
    t.onmouseenter = () => show(+t.dataset.i);
    t.onclick = () => show(+t.dataset.i);
  });
}

function rows(pairs) {
  if (!pairs || !pairs.length) return '<div class="empty">nothing here</div>';
  const v = pairs.map(p=>p[1]), lo=Math.min(...v), hi=Math.max(...v), s=(hi-lo)||1;
  return pairs.map(([t,x]) => bar(t, x, (x-lo)/s, false, fmt(x))).join("");
}
function bar(label, raw, frac, hot, right) {
  return `<div class="tok"><span class="w mono" ${hot?'style="color:var(--regulator)"':''}>${esc(label)||"␣"}</span>
    <div class="barwrap"><div class="barfill" style="width:${(100*frac).toFixed(1)}%"></div></div>
    <span class="v">${right ?? raw.toFixed(2)}</span></div>`;
}
function txt(s){ return `<div class="txt">${esc(s||"—")}</div>`; }
function fmt(x){ return x==null?"—":(Math.round(x*100)/100).toFixed(1); }
function esc(s){ return (s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
// strength is a multiple of the residual-stream norm; show it as e.g. "1×", "0.35×"
function sx(v){ return `${(+v).toFixed(2).replace(/\.?0+$/,"")}×`; }
function scroll(){ const m=document.querySelector("main"); m.scrollTop=m.scrollHeight; }

async function send() {
  const text = $("input").value.trim();
  if (!text || BUSY) return;
  BUSY = true; $("dot").classList.add("busy"); $("send").disabled = true;
  $("input").value = ""; $("input").style.height = "auto";
  addYou(text);
  const pending = document.createElement("div");
  pending.className = "msg mind"; pending.innerHTML = `<div class="who">the mind</div><div class="bubble empty">running the four parts live… (~90s)</div>`;
  $("thread").appendChild(pending); scroll();
  try {
    const r = await fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message:text})});
    const data = await r.json();
    pending.remove();
    if (data.error) { addError(data.error); }
    else { addMind(data); $("meta").textContent = `turn ${data.turn}`; }
  } catch (e) { pending.remove(); addError(String(e)); }
  finally { BUSY=false; $("dot").classList.remove("busy"); $("send").disabled=false; $("input").focus(); }
}

function addError(msg) {
  const el = document.createElement("div");
  el.className = "msg mind";
  el.innerHTML = `<div class="who">error</div><div class="bubble" style="border-color:var(--bad);color:var(--bad)"></div>`;
  el.querySelector(".bubble").textContent = msg;
  $("thread").appendChild(el); scroll();
}

$("send").onclick = send;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", e => {
  e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px";
});
$("reset").onclick = async () => {
  await fetch("/reset", {method:"POST"});
  $("thread").innerHTML = ""; $("meta").textContent = ""; $("input").focus();
};
$("input").focus();
</script>
</body>
</html>
